{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Step-up verification</h2>
  <p class="muted">Enter the 6-digit code from Google Authenticator for <b>{{ username }}</b>.</p>
  <form method="post">
    <input name="code" maxlength="6" inputmode="numeric" placeholder="123456" required autofocus>
    <button>Verify</button>
  </form>
</div>
{% endblock %}
