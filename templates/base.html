<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroGate</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    header { background: #1e293b; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header b { color: #38bdf8; font-size: 20px; }
    header a { color: #94a3b8; margin-left: 16px; text-decoration: none; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .narrow { max-width: 420px; margin: 0 auto; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    button, .btn { background: #0ea5e9; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
    .flash { background: #334155; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
    details { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 14px; }
    summary { cursor: pointer; color: #fbbf24; }
    small, .muted { color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid #334155; text-align: left; vertical-align: top; }
    .ALLOW { color: #4ade80; } .OTP { color: #fbbf24; } .BLOCK, .FAILED { color: #f87171; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat { font-size: 28px; font-weight: bold; }
    a { color: #38bdf8; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <b>🛡️ ZeroGate</b>
    <nav>
      {% if session.user_id %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_logs') }}">Logs</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
